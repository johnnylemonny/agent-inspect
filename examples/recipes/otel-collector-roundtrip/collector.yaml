receivers:
  otlp:
    protocols:
      http:
        # Bind all interfaces inside the container; host publishes 127.0.0.1:4318 only.
        endpoint: 0.0.0.0:4318

exporters:
  file:
    path: /out/collected-traces.json
    format: json

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file]
